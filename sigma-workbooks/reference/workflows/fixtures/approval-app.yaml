# Best-practice fixture for an approval app.
# Replace <FOLDER_ID>, <WRITE_CONNECTION_ID>, <SOURCE_CONNECTION_ID>, and
# [Source/…] column names from live discovery before POST.
# Published data entry is UI-only: element kebab → Set data entry permission
# → Only in published version. That setting is absent from GET /spec.
# Architecture: ../approval-apps.md. Intake: ../generate-apps.md.
name: Approval app
folderId: "<FOLDER_ID>"
document:
  schemaVersion: 1
  kind: workbook
  settings:
    theme:
      name: Light
      overrides:
        colors:
          highlight: "#3B82F6"
        borderRadius: round
        hasCards: shown
        space:
          unit: medium
          showElementPadding: shown
        tableStyles:
          preset: presentation
          cellSpacing: small
          gridLines: horizontal
          banding: shown
          bandingColor: "#F8FAFC"
        categoricalScheme:
        - "#3B82F6"
        - "#F59E0B"
        - "#EF4444"
        - "#8B5CF6"
        - "#06B6D4"
        - "#10B981"
  elements:
  - id: source-approval
    kind: table
    name: Source
    source:
      kind: warehouse-table
      connectionId: "<SOURCE_CONNECTION_ID>"
      path:
      - "<SOURCE_DATABASE>"
      - "<SOURCE_SCHEMA>"
      - Source
    columns:
    - id: src-deal
      formula: "[Source/Deal ID]"
      name: Deal ID
    - id: src-amount
      formula: "[Source/List Amount]"
      name: List Amount
    - id: src-discount
      formula: "[Source/Submitted Discount]"
      name: Submitted Discount
    - id: src-status
      formula: "[Source/Status]"
      name: Status
    - id: src-age
      formula: "[Source/Age Days]"
      name: Age Days
  - id: deal-directory
    kind: table
    name: Deal Directory
    source:
      kind: table
      elementId: source-approval
    columns:
    - id: dd-deal
      formula: "[Source/Deal ID]"
      name: Deal ID
    - id: dd-amount
      formula: "[Source/List Amount]"
      name: List Amount
    - id: dd-discount
      formula: "[Source/Submitted Discount]"
      name: Submitted Discount
    - id: dd-status
      formula: "[Source/Status]"
      name: Status
    - id: dd-age
      formula: "[Source/Age Days]"
      name: Age Days
  - id: review-queue
    kind: input-table
    inputMode: view
    name: Review Queue
    source:
      kind: linked
      from: deal-directory
      connectionId: "<WRITE_CONNECTION_ID>"
    columns:
    - id: rq-deal
      key: dd-deal
      name: Deal ID
    - id: rq-amount
      key: dd-amount
      name: List Amount
    - id: rq-discount
      key: dd-discount
      name: Submitted Discount
    - id: rq-status
      key: dd-status
      name: Source Status
    - id: rq-age
      key: dd-age
      name: Age Days
    - id: rq-decision
      type: text
      name: Decision
      values: [Pending, Approved, Rejected, Counter]
      pills: color-by-option
    - id: rq-counter
      type: number
      name: Approved Discount
    - id: rq-reviewer
      type: text
      name: Reviewer
    - id: rq-note
      type: text
      name: Decision Note
    - id: rq-approved-net
      formula: "[List Amount] * (1 - Coalesce([Approved Discount], [Submitted Discount]))"
      name: Approved Net
    - id: rq-submitted-net
      formula: "[List Amount] * (1 - [Submitted Discount])"
      name: Submitted Net
    - id: rq-impact
      formula: "[Approved Net] - [Submitted Net]"
      name: Revenue Impact
  - id: decision-log
    kind: input-table
    inputMode: view
    name: Decision log
    source:
      kind: empty
      connectionId: "<WRITE_CONNECTION_ID>"
    columns:
    - id: ID
    - id: dl-deal
      type: text
      name: Deal ID
    - id: dl-decision
      type: text
      name: Decision
    - id: dl-note
      type: text
      name: Comment
    - id: CREATED_AT
    - id: CREATED_BY
  - id: btn-submit
    kind: button
    text: Record decision
    appearance: filled
    actions:
    - id: a-approval-submit
      trigger: on-click
      effects:
      - effect: insert-rows
        tableElementId: decision-log
        values:
          dl-deal: { type: control, control: dealControl }
          dl-decision: { type: control, control: decisionControl }
          dl-note: { type: control, control: noteControl }
      - effect: update-rows
        tableElementId: review-queue
        whichRows:
          type: formula
          formula: "[Deal ID] = [dealControl]"
        values:
          rq-decision: { type: control, control: decisionControl }
          rq-note: { type: control, control: noteControl }
      - effect: clear-control
        scope: { type: page, pageId: page-app }
        usePublishedValue: true
  - id: kpi-impact
    kind: kpi-chart
    name: ' '
    source:
      kind: table
      elementId: review-queue
    columns:
    - id: kpi-impact-val
      formula: Sum([Review Queue/Revenue Impact])
      name: ' '
      format:
        kind: number
        formatString: "$,.2s"
    value:
      columnId: kpi-impact-val
      fontSize: 32
      color: "#0F172A"
  - id: ctrl-deal
    kind: control
    controlId: dealControl
    name: Deal
    controlType: list
    mode: include
    selectionMode: single
    values: []
    source:
      kind: source
      source:
        kind: table
        elementId: deal-directory
      columnId: dd-deal
  - id: ctrl-decision
    kind: control
    controlId: decisionControl
    name: Decision
    controlType: text
  - id: ctrl-note
    kind: control
    controlId: noteControl
    name: Comment
    controlType: text
  - id: hero
    kind: container
    style:
      backgroundColor: "#0F172A"
      borderRadius: round
  - id: title
    kind: text
    verticalAlign: middle
    body: |
      # <span style="color: #FFFFFF">Approval app</span>
      <p class="p-small"><span style="color: #94A3B8">Review the queue, record a decision, and keep an audit log</span></p>
  - id: section-entry
    kind: text
    body: |
      ## Record a decision
  - id: kpi-impact-box
    kind: container
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: round
      borderColor: "#E2E8F0"
      borderWidth: 1
  - id: kpi-impact-label
    kind: text
    body: |
      <p class="p-small"><span style="color: #3B82F6">**REVENUE IMPACT**</span></p>
  - id: section-queue
    kind: text
    body: |
      ## Review queue
  - id: divider-1
    kind: divider
  - id: section-log
    kind: text
    body: |
      ## Decision log
  pages:
  - id: page-source
    name: Source
    visibility: hidden
  - id: page-app
    name: Approvals
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="page-source">
      <Element elementId="source-approval" gridColumn="1 / 25" gridRow="1 / 10"/>
      <Element elementId="deal-directory" gridColumn="1 / 25" gridRow="10 / 19"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="page-app">
      <Container elementId="hero" type="grid" gridColumn="1 / 25" gridRow="1 / 4"
                     gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto">
        <Element elementId="title" gridColumn="1 / 25" gridRow="1 / 4"/>
      </Container>
      <Element elementId="section-entry" gridColumn="1 / 25" gridRow="4 / 5"/>
      <Element elementId="ctrl-deal" gridColumn="1 / 9" gridRow="5 / 7"/>
      <Element elementId="ctrl-decision" gridColumn="9 / 17" gridRow="5 / 7"/>
      <Element elementId="ctrl-note" gridColumn="17 / 25" gridRow="5 / 7"/>
      <Element elementId="section-queue" gridColumn="1 / 25" gridRow="7 / 8"/>
      <Container elementId="kpi-impact-box" type="grid" gridColumn="1 / 9" gridRow="8 / 15"
                     gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto">
        <Element elementId="kpi-impact-label" gridColumn="1 / 25" gridRow="1 / 3"/>
        <Element elementId="kpi-impact" gridColumn="1 / 25" gridRow="3 / 8"/>
      </Container>
      <Element elementId="review-queue" gridColumn="9 / 25" gridRow="8 / 22"/>
      <Element elementId="divider-1" gridColumn="1 / 25" gridRow="22 / 23"/>
      <Element elementId="section-log" gridColumn="1 / 25" gridRow="23 / 24"/>
      <Element elementId="decision-log" gridColumn="1 / 19" gridRow="24 / 33"/>
      <Element elementId="btn-submit" gridColumn="19 / 25" gridRow="24 / 27"/>
    </Page>
