# Best-practice fixture for an allocation app.
# Replace <FOLDER_ID>, <WRITE_CONNECTION_ID>, <SOURCE_CONNECTION_ID>, and
# [Source/…] column names from live discovery before POST.
# Published data entry is UI-only: element kebab → Set data entry permission
# → Only in published version. That setting is absent from GET /spec.
# Architecture: ../allocation-apps.md. Intake: ../generate-apps.md.
name: Allocation app
folderId: "<FOLDER_ID>"
document:
  schemaVersion: 1
  kind: workbook
  settings:
    theme:
      name: Light
      overrides:
        colors:
          highlight: "#3B82F6"
        borderRadius: round
        hasCards: shown
        space:
          unit: medium
          showElementPadding: shown
        tableStyles:
          preset: presentation
          cellSpacing: small
          gridLines: horizontal
          banding: shown
          bandingColor: "#F8FAFC"
        categoricalScheme:
        - "#3B82F6"
        - "#F59E0B"
        - "#EF4444"
        - "#8B5CF6"
        - "#06B6D4"
        - "#10B981"
  elements:
  - id: source-alloc
    kind: table
    name: Source
    source:
      kind: warehouse-table
      connectionId: "<SOURCE_CONNECTION_ID>"
      path:
      - "<SOURCE_DATABASE>"
      - "<SOURCE_SCHEMA>"
      - Source
    columns:
    - id: src-period
      formula: "[Source/Period]"
      name: Period
    - id: src-dim
      formula: "[Source/Department]"
      name: Department
    - id: src-headcount
      formula: "[Source/Baseline Headcount]"
      name: Baseline Headcount
    - id: src-cost
      formula: "[Source/Baseline Loaded Cost]"
      name: Baseline Loaded Cost
    - id: src-budget
      formula: "[Source/Budget]"
      name: Budget
    - id: src-hire-cost
      formula: "[Source/Monthly Loaded Cost per Hire]"
      name: Monthly Loaded Cost per Hire
  - id: alloc-base
    kind: table
    name: Allocation Base
    source:
      kind: table
      elementId: source-alloc
    columns:
    - id: ab-period
      formula: "[Source/Period]"
      name: Period
    - id: ab-dim
      formula: "[Source/Department]"
      name: Department
    - id: ab-headcount
      formula: "[Source/Baseline Headcount]"
      name: Baseline Headcount
    - id: ab-cost
      formula: "[Source/Baseline Loaded Cost]"
      name: Baseline Loaded Cost
    - id: ab-budget
      formula: "[Source/Budget]"
      name: Budget
    - id: ab-hire-cost
      formula: "[Source/Monthly Loaded Cost per Hire]"
      name: Monthly Loaded Cost per Hire
  - id: alloc-grid
    kind: input-table
    inputMode: view
    name: Allocation Grid
    source:
      kind: linked
      from: alloc-base
      connectionId: "<WRITE_CONNECTION_ID>"
    columns:
    - id: ag-period
      key: ab-period
      name: Period
    - id: ag-dim
      key: ab-dim
      name: Department
    - id: ag-headcount
      key: ab-headcount
      name: Baseline Headcount
    - id: ag-cost
      key: ab-cost
      name: Baseline Loaded Cost
    - id: ag-budget
      key: ab-budget
      name: Budget
    - id: ag-hire-cost
      key: ab-hire-cost
      name: Monthly Loaded Cost per Hire
    - id: ag-hires
      type: number
      name: Added Hires
    - id: ag-uplift
      type: number
      name: Cost Uplift %
    - id: ag-note
      type: text
      name: Rationale
    - id: ag-plan-hc
      formula: "[Baseline Headcount] + Coalesce([Added Hires], 0)"
      name: Plan Headcount
    - id: ag-plan-cost
      formula: "[Baseline Loaded Cost] * (1 + Coalesce([Cost Uplift %], 0)) + Coalesce([Added Hires], 0) * [Monthly Loaded Cost per Hire]"
      name: Plan Cost
    - id: ag-variance
      formula: "[Plan Cost] - [Budget]"
      name: Vs Budget
  - id: request-log
    kind: input-table
    inputMode: view
    name: Request log
    source:
      kind: empty
      connectionId: "<WRITE_CONNECTION_ID>"
    columns:
    - id: ID
    - id: rl-period
      type: text
      name: Period
    - id: rl-dim
      type: text
      name: Department
    - id: rl-request
      type: text
      name: Request
    - id: rl-note
      type: text
      name: Comment
    - id: CREATED_AT
    - id: CREATED_BY
  - id: btn-request
    kind: button
    text: Log request
    appearance: filled
    actions:
    - id: a-alloc-request
      trigger: on-click
      effects:
      - effect: insert-rows
        tableElementId: request-log
        values:
          rl-period: { type: control, control: periodControl }
          rl-dim: { type: control, control: dimControl }
          rl-request: { type: control, control: requestControl }
          rl-note: { type: control, control: noteControl }
      - effect: clear-control
        scope: { type: page, pageId: page-app }
        usePublishedValue: true
  - id: kpi-variance
    kind: kpi-chart
    name: ' '
    source:
      kind: table
      elementId: alloc-grid
    columns:
    - id: kpi-var-val
      formula: Sum([Allocation Grid/Vs Budget])
      name: ' '
      format:
        kind: number
        formatString: "$,.2s"
    value:
      columnId: kpi-var-val
      fontSize: 32
      color: "#0F172A"
  - id: ctrl-period
    kind: control
    controlId: periodControl
    name: Period
    controlType: text
  - id: ctrl-dim
    kind: control
    controlId: dimControl
    name: Department
    controlType: text
  - id: ctrl-request
    kind: control
    controlId: requestControl
    name: Request
    controlType: text
  - id: ctrl-note
    kind: control
    controlId: noteControl
    name: Comment
    controlType: text
  - id: hero
    kind: container
    style:
      backgroundColor: "#0F172A"
      borderRadius: round
  - id: title
    kind: text
    verticalAlign: middle
    body: |
      # <span style="color: #FFFFFF">Allocation app</span>
      <p class="p-small"><span style="color: #94A3B8">Redistribute across the dimension and log a request</span></p>
  - id: section-entry
    kind: text
    body: |
      ## Log a request
  - id: kpi-variance-box
    kind: container
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: round
      borderColor: "#E2E8F0"
      borderWidth: 1
  - id: kpi-variance-label
    kind: text
    body: |
      <p class="p-small"><span style="color: #3B82F6">**VS BUDGET**</span></p>
  - id: section-grid
    kind: text
    body: |
      ## Allocation grid
  - id: divider-1
    kind: divider
  - id: section-log
    kind: text
    body: |
      ## Request log
  pages:
  - id: page-source
    name: Source
    visibility: hidden
  - id: page-app
    name: Allocation
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="page-source">
      <Element elementId="source-alloc" gridColumn="1 / 25" gridRow="1 / 10"/>
      <Element elementId="alloc-base" gridColumn="1 / 25" gridRow="10 / 19"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="page-app">
      <Container elementId="hero" type="grid" gridColumn="1 / 25" gridRow="1 / 4"
                     gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto">
        <Element elementId="title" gridColumn="1 / 25" gridRow="1 / 4"/>
      </Container>
      <Element elementId="section-entry" gridColumn="1 / 25" gridRow="4 / 5"/>
      <Element elementId="ctrl-period" gridColumn="1 / 7" gridRow="5 / 7"/>
      <Element elementId="ctrl-dim" gridColumn="7 / 13" gridRow="5 / 7"/>
      <Element elementId="ctrl-request" gridColumn="13 / 19" gridRow="5 / 7"/>
      <Element elementId="ctrl-note" gridColumn="19 / 25" gridRow="5 / 7"/>
      <Element elementId="section-grid" gridColumn="1 / 25" gridRow="7 / 8"/>
      <Container elementId="kpi-variance-box" type="grid" gridColumn="1 / 9" gridRow="8 / 15"
                     gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto">
        <Element elementId="kpi-variance-label" gridColumn="1 / 25" gridRow="1 / 3"/>
        <Element elementId="kpi-variance" gridColumn="1 / 25" gridRow="3 / 8"/>
      </Container>
      <Element elementId="alloc-grid" gridColumn="9 / 25" gridRow="8 / 22"/>
      <Element elementId="divider-1" gridColumn="1 / 25" gridRow="22 / 23"/>
      <Element elementId="section-log" gridColumn="1 / 25" gridRow="23 / 24"/>
      <Element elementId="request-log" gridColumn="1 / 19" gridRow="24 / 33"/>
      <Element elementId="btn-request" gridColumn="19 / 25" gridRow="24 / 27"/>
    </Page>
