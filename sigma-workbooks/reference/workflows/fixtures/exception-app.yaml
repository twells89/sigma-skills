# Best-practice fixture for an exception app.
# Replace <FOLDER_ID>, <WRITE_CONNECTION_ID>, <SOURCE_CONNECTION_ID>, and
# [Source/…] column names from live discovery before POST.
# Published data entry is UI-only: element kebab → Set data entry permission
# → Only in published version. That setting is absent from GET /spec.
# Architecture: ../exception-apps.md. Intake: ../generate-apps.md.
# The recommendation column is a policy formula, not an "AI" label.
name: Exception app
folderId: "<FOLDER_ID>"
document:
  schemaVersion: 1
  kind: workbook
  settings:
    theme:
      name: Light
      overrides:
        colors:
          highlight: "#3B82F6"
        borderRadius: round
        hasCards: shown
        space:
          unit: medium
          showElementPadding: shown
        tableStyles:
          preset: presentation
          cellSpacing: small
          gridLines: horizontal
          banding: shown
          bandingColor: "#F8FAFC"
        categoricalScheme:
        - "#3B82F6"
        - "#F59E0B"
        - "#EF4444"
        - "#8B5CF6"
        - "#06B6D4"
        - "#10B981"
  elements:
  - id: source-exception
    kind: table
    name: Source
    source:
      kind: warehouse-table
      connectionId: "<SOURCE_CONNECTION_ID>"
      path:
      - "<SOURCE_DATABASE>"
      - "<SOURCE_SCHEMA>"
      - Source
    columns:
    - id: src-sku
      formula: "[Source/SKU]"
      name: SKU
    - id: src-on-hand
      formula: "[Source/On Hand]"
      name: On Hand
    - id: src-on-order
      formula: "[Source/On Order]"
      name: On Order
    - id: src-reorder
      formula: "[Source/Reorder Point]"
      name: Reorder Point
    - id: src-cost
      formula: "[Source/Unit Cost]"
      name: Unit Cost
    - id: src-flag
      formula: "[Source/Exception Flag]"
      name: Exception Flag
  - id: exception-directory
    kind: table
    name: Exception Directory
    source:
      kind: table
      elementId: source-exception
    columns:
    - id: ed-sku
      formula: "[Source/SKU]"
      name: SKU
    - id: ed-on-hand
      formula: "[Source/On Hand]"
      name: On Hand
    - id: ed-on-order
      formula: "[Source/On Order]"
      name: On Order
    - id: ed-reorder
      formula: "[Source/Reorder Point]"
      name: Reorder Point
    - id: ed-cost
      formula: "[Source/Unit Cost]"
      name: Unit Cost
    - id: ed-flag
      formula: "[Source/Exception Flag]"
      name: Exception Flag
  - id: action-queue
    kind: input-table
    inputMode: view
    name: Action Queue
    source:
      kind: linked
      from: exception-directory
      connectionId: "<WRITE_CONNECTION_ID>"
    columns:
    - id: aq-sku
      key: ed-sku
      name: SKU
    - id: aq-on-hand
      key: ed-on-hand
      name: On Hand
    - id: aq-on-order
      key: ed-on-order
      name: On Order
    - id: aq-reorder
      key: ed-reorder
      name: Reorder Point
    - id: aq-cost
      key: ed-cost
      name: Unit Cost
    - id: aq-flag
      key: ed-flag
      name: Exception Flag
    - id: aq-suggested
      formula: If([Reorder Point] - [On Hand] - [On Order] > 0, [Reorder Point] - [On Hand] - [On Order], 0)
      name: Suggested Order
    - id: aq-override
      type: number
      name: Override Order Qty
    - id: aq-decision
      type: text
      name: Decision
      values: [Open, Accept suggestion, Override, Dismiss]
      pills: color-by-option
    - id: aq-owner
      type: text
      name: Owner
    - id: aq-note
      type: text
      name: Resolution Note
    - id: aq-final
      formula: Coalesce([Override Order Qty], [Suggested Order])
      name: Final Order
    - id: aq-value
      formula: "[Final Order] * [Unit Cost]"
      name: Order Value
  - id: resolution-log
    kind: input-table
    inputMode: view
    name: Resolution log
    source:
      kind: empty
      connectionId: "<WRITE_CONNECTION_ID>"
    columns:
    - id: ID
    - id: rl-sku
      type: text
      name: SKU
    - id: rl-decision
      type: text
      name: Decision
    - id: rl-note
      type: text
      name: Comment
    - id: CREATED_AT
    - id: CREATED_BY
  - id: btn-resolve
    kind: button
    text: Log resolution
    appearance: filled
    actions:
    - id: a-exception-resolve
      trigger: on-click
      effects:
      - effect: insert-rows
        tableElementId: resolution-log
        values:
          rl-sku: { type: control, control: skuControl }
          rl-decision: { type: control, control: decisionControl }
          rl-note: { type: control, control: noteControl }
      - effect: clear-control
        scope: { type: page, pageId: page-app }
        usePublishedValue: true
  - id: kpi-order-value
    kind: kpi-chart
    name: ' '
    source:
      kind: table
      elementId: action-queue
    columns:
    - id: kpi-value-val
      formula: Sum([Action Queue/Order Value])
      name: ' '
      format:
        kind: number
        formatString: "$,.2s"
    value:
      columnId: kpi-value-val
      fontSize: 32
      color: "#0F172A"
  - id: ctrl-sku
    kind: control
    controlId: skuControl
    name: SKU
    controlType: list
    mode: include
    selectionMode: single
    values: []
    source:
      kind: source
      source:
        kind: table
        elementId: exception-directory
      columnId: ed-sku
  - id: ctrl-decision
    kind: control
    controlId: decisionControl
    name: Decision
    controlType: text
  - id: ctrl-note
    kind: control
    controlId: noteControl
    name: Comment
    controlType: text
  - id: hero
    kind: container
    style:
      backgroundColor: "#0F172A"
      borderRadius: round
  - id: title
    kind: text
    verticalAlign: middle
    body: |
      # <span style="color: #FFFFFF">Exception command center</span>
      <p class="p-small"><span style="color: #94A3B8">Triage exceptions, apply an override, and log the resolution</span></p>
  - id: section-entry
    kind: text
    body: |
      ## Log a resolution
  - id: kpi-order-value-box
    kind: container
    style:
      backgroundColor: "#FFFFFF"
      borderRadius: round
      borderColor: "#E2E8F0"
      borderWidth: 1
  - id: kpi-order-value-label
    kind: text
    body: |
      <p class="p-small"><span style="color: #3B82F6">**ORDER VALUE**</span></p>
  - id: section-queue
    kind: text
    body: |
      ## Action queue
  - id: divider-1
    kind: divider
  - id: section-log
    kind: text
    body: |
      ## Resolution log
  pages:
  - id: page-source
    name: Source
    visibility: hidden
  - id: page-app
    name: Exceptions
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="page-source">
      <Element elementId="source-exception" gridColumn="1 / 25" gridRow="1 / 10"/>
      <Element elementId="exception-directory" gridColumn="1 / 25" gridRow="10 / 19"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="page-app">
      <Container elementId="hero" type="grid" gridColumn="1 / 25" gridRow="1 / 4"
                     gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto">
        <Element elementId="title" gridColumn="1 / 25" gridRow="1 / 4"/>
      </Container>
      <Element elementId="section-entry" gridColumn="1 / 25" gridRow="4 / 5"/>
      <Element elementId="ctrl-sku" gridColumn="1 / 9" gridRow="5 / 7"/>
      <Element elementId="ctrl-decision" gridColumn="9 / 17" gridRow="5 / 7"/>
      <Element elementId="ctrl-note" gridColumn="17 / 25" gridRow="5 / 7"/>
      <Element elementId="section-queue" gridColumn="1 / 25" gridRow="7 / 8"/>
      <Container elementId="kpi-order-value-box" type="grid" gridColumn="1 / 9" gridRow="8 / 15"
                     gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto">
        <Element elementId="kpi-order-value-label" gridColumn="1 / 25" gridRow="1 / 3"/>
        <Element elementId="kpi-order-value" gridColumn="1 / 25" gridRow="3 / 8"/>
      </Container>
      <Element elementId="action-queue" gridColumn="9 / 25" gridRow="8 / 22"/>
      <Element elementId="divider-1" gridColumn="1 / 25" gridRow="22 / 23"/>
      <Element elementId="section-log" gridColumn="1 / 25" gridRow="23 / 24"/>
      <Element elementId="resolution-log" gridColumn="1 / 19" gridRow="24 / 33"/>
      <Element elementId="btn-resolve" gridColumn="19 / 25" gridRow="24 / 27"/>
    </Page>
